name: APEX machine reference finalize
on:
  push:
    branches: [main]
    paths: [.github/workflows/apex-machine-reference-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Rewrite repo-wide machine authority references
        shell: python
        run: |
          from pathlib import Path
          old='canon'+'ical'; suffixes={'.md','.json','.yaml','.yml','.py','.mjs','.js','.ts','.tsx','.toml','.txt','.csv','.sh','.ps1'}
          replacements=((f'machine/{old}-position-proof.json','machine/apex-position-proof.json'),(f'machine/{old}-position.json','machine/apex-position.json'),(f'{old}_position','apex_position'),(f'{old}-position','apex-position'),(f'{old}.position','apex.position'))
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes or '.git' in path.parts or path.as_posix()=='.github/workflows/apex-machine-reference-finalize.yml': continue
              text=path.read_text(encoding='utf-8',errors='ignore'); out=text
              for a,b in replacements: out=out.replace(a,b).replace(a.upper(),b.upper())
              if out!=text: path.write_text(out,encoding='utf-8')
          for suffix in ('-position.json','-position-proof.json'):
              src=Path('machine')/f'{old}{suffix}'; dst=Path('machine')/f'apex{suffix}'
              if src.exists():
                  if dst.exists(): src.unlink()
                  else: src.rename(dst)
          residue=[]
          needle=f'machine/{old}-position'
          for path in Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts and path.as_posix()!='.github/workflows/apex-machine-reference-finalize.yml':
                  if needle in path.read_text(encoding='utf-8',errors='ignore').lower(): residue.append(path.as_posix())
          if residue: raise SystemExit('retired machine reference remains: '+', '.join(residue))
      - name: Self-remove and commit
        run: |
          rm .github/workflows/apex-machine-reference-finalize.yml
          git config user.name "GlacierEQ APEX Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "APEX: finalize machine authority references"
          git push origin HEAD:main
